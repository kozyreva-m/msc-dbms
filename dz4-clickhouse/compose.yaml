name: takt-clickhouse-homework

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8.33.6
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
    environment:
      CLICKHOUSE_USER: student
      CLICKHOUSE_PASSWORD: takt
      CLICKHOUSE_DB: takt
      CLICKHOUSE_DO_NOT_CHOWN: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./data:/var/lib/clickhouse/user_files/data:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "student", "--password", "takt", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  clickhouse_data: