# Redis Sentinel следит за мастером и при отказе переключает
# роль мастера на одну из реплик. Запущено 3 процесса, кворум 2.
#
# Это шаблон. Sentinel переписывает свой конфиг во время работы, поэтому
# каждому нужен свой файл: sentinel1.conf, sentinel2.conf, sentinel3.conf.
# Все они копии этого файла.

port 26379

# Двое из трёх Sentinel должны согласиться, что мастер недоступен.
sentinel monitor mymaster redis-master 6379 2
# Через 5 секунд без ответа на PING мастер считается субъективно недоступным.
sentinel down-after-milliseconds mymaster 5000
# Реплики перенастраиваются на нового мастера по одной.
sentinel parallel-syncs mymaster 1
# Тайм-аут на весь процесс failover.
sentinel failover-timeout mymaster 60000
# В Docker Sentinel должен разрешать имена контейнеров (redis-master).
sentinel resolve-hostnames yes
sentinel announce-hostnames yes
