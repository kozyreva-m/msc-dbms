# Redis master, принимает все операции записи.

port 6379
bind 0.0.0.0
protected-mode no
dir /data

# --- Персистентность: RDB-снимки ---
# Снимок на диск, если за N секунд изменилось хотя бы M ключей.
save 900 1
save 300 10
save 60 10000

# --- Персистентность: AOF-журнал ---
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# --- Память и вытеснение ---
# volatile-lru вытесняет только ключи с TTL (кеш, счётчики входов),
# профили, лидерборд и достижения без TTL не трогает.
maxmemory 256mb
maxmemory-policy volatile-lru

# --- Защита от split-brain ---
# Мастер принимает записи, только если хотя бы одна реплика отвечала
# не позже 10 секунд назад. Изолированный мастер записи отклоняет.
min-replicas-to-write 1
min-replicas-max-lag 10
